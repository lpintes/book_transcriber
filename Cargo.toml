[package]
name = "book_transcriber"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
anyhow = "1"
dirs = "5"
mupdf = { version = "0.8.0", optional = true }

[features]
# Render PDFs with a statically linked MuPDF (needs Clang and a C toolchain).
mupdf = ["dep:mupdf"]
