name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tests that need these tools are skipped where they are missing
      # (here: on Windows).
      - name: Install Poppler and DjVuLibre
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils djvulibre-bin

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: book_transcriber-windows-x86_64
          path: target/release/book_transcriber.exe
